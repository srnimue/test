<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちの子・よその子図鑑 TEST v9</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3f0;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
.header-inner{max-width:900px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:18px;margin:0}
button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:9px 13px;font-size:14px;cursor:pointer}
button:hover{background:#f0f0f0}
.primary{background:#333;color:#fff;border-color:#333}
.primary:hover{background:#222}
main{max-width:900px;margin:0 auto;padding:20px 16px 50px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.toolbar h2{font-size:17px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden;cursor:pointer}
.card-img{aspect-ratio:1/1;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:12px}
.card-name{font-weight:bold;font-size:16px;margin-bottom:5px}
.card-use{font-size:13px;color:#777}
.empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:45px 20px;text-align:center;color:#888}
.page{display:none}
.page.active{display:block}
.back{margin-bottom:15px}
.form{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input[type=text],textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;font:inherit;background:#fff}
textarea{min-height:100px;resize:vertical}
.preview{width:160px;height:160px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;overflow:hidden;margin-bottom:8px}
.preview img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.section-title{font-size:14px;font-weight:bold;margin:22px 0 10px}
.locked{background:#f4f4f4;border:1px solid #ddd;border-radius:9px;padding:12px;color:#777}
.notice{font-size:12px;color:#888;margin-top:8px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}
.custom-item{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:start}
.custom-item textarea{width:100%;min-height:42px;max-height:168px;resize:none;overflow-y:auto;line-height:1.5;white-space:pre-wrap}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.custom-item{grid-template-columns:1fr}.custom-item button{justify-self:start}.header-inner{align-items:flex-start}}

.home-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cards.icon-mode{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:18px 10px}
.cards.icon-mode .card{background:transparent;border:0;box-shadow:none;overflow:visible;min-width:0}
.cards.icon-mode .card-img{width:76px;height:76px;margin:0 auto;border-radius:50%;border:2px solid #ddd}
.cards.icon-mode .card-body{padding:7px 2px 0;text-align:center}
.cards.icon-mode .card-name{font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards.icon-mode .card-use{display:none}
.cards.icon-mode .card-actions{display:none}

.cards.icon-mode .card-img{overflow:hidden;border-radius:50%}
.cards.icon-mode .card-img img{border-radius:50%}
.cards.list-mode{display:flex;flex-direction:column;gap:0}
.cards.list-mode .card{display:flex;align-items:center;gap:12px;border-radius:0;border-left:0;border-right:0;border-top:0;padding:10px 4px}
.cards.list-mode .card-img{width:52px;height:52px;min-width:52px;border-radius:50%;overflow:hidden}
.cards.list-mode .card-img img{border-radius:50%}
.cards.list-mode .card-body{padding:0}
.cards.list-mode .card-use{font-size:12px;color:#777;margin-top:2px}
.view-buttons{display:flex;gap:4px}
.view-buttons button{padding:7px 9px;font-size:12px}
.image-adjust{margin-top:10px}
.image-adjust button{width:100%}
.crop-modal{position:fixed;inset:0;background:#111;z-index:100;display:none;align-items:stretch;justify-content:center}
.crop-modal.open{display:flex}
.crop-panel{width:min(720px,100%);height:100%;background:#111;color:#fff;display:flex;flex-direction:column;overflow:hidden}
.crop-head{height:56px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.12)}
.crop-head strong{text-align:center;font-size:16px}
.crop-close,.crop-done{border:0;background:transparent;color:#fff;padding:8px;font:inherit}
.crop-close{font-size:28px;text-align:left}
.crop-done{font-weight:700;text-align:right}
.crop-help{text-align:center;font-size:12px;color:#bbb;padding:12px 12px 8px}
.crop-stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
.crop-stage{position:relative;width:min(92vw,620px);aspect-ratio:1;background:#222;overflow:hidden;touch-action:none;user-select:none}
.crop-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform-origin:center center;will-change:transform}
.crop-stage:before{content:"";position:absolute;inset:8%;border:2px solid rgba(255,255,255,.95);z-index:2;pointer-events:none}
.crop-stage:after{content:"";position:absolute;width:62%;height:62%;left:19%;top:19%;border:2px solid rgba(255,255,255,.95);border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.22);z-index:3;pointer-events:none}
.crop-footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));text-align:center}
.crop-reset{background:#2a2a2a;color:#fff;border-color:#555;min-width:160px}
@media(max-width:600px){.crop-stage{width:100%}}
.cards:not(.icon-mode):not(.list-mode) .card-img{width:100%;aspect-ratio:1/1;overflow:hidden;position:relative}
.cards:not(.icon-mode):not(.list-mode) .card-body{position:relative;background:#fff;min-height:58px}
.cards:not(.icon-mode):not(.list-mode) .card-name,.cards:not(.icon-mode):not(.list-mode) .card-use{position:relative;z-index:1}
@media(max-width:600px){.crop-panel{padding:13px;border-radius:14px}.crop-stage{width:min(90vw,360px)}}


.detail-hero{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.detail-hero .preview{flex:0 0 160px;margin-bottom:0}
.detail-summary{min-width:0;flex:1;padding-top:2px}
.detail-summary h2{margin:0 0 10px;font-size:24px;line-height:1.3;overflow-wrap:anywhere}
.detail-use-label{font-size:12px;font-weight:bold;color:#999;margin-bottom:3px}
.detail-use{color:#777;overflow-wrap:anywhere}
.detail-custom{border-top:1px solid #eee;padding-top:4px}
.detail-custom p{margin:14px 0}
.detail-value{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
@media(max-width:430px){.detail-hero{gap:12px}.detail-hero .preview{width:132px;height:132px;flex-basis:132px}.detail-summary h2{font-size:21px}}

.home-filter{display:flex;align-items:center;gap:9px;margin:-6px 0 16px}
.home-filter label{font-size:12px;color:#777;white-space:nowrap}
.home-filter select{min-width:180px;max-width:100%;padding:8px 30px 8px 10px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:13px;color:#333}
@media(max-width:600px){.home-filter select{flex:1;min-width:0}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>うちの子・よその子図鑑 <small style="font-weight:normal;color:#999">TEST</small></h1>
    <button id="importBtn">URLから追加</button>
  </div>
</header>

<main>
  <section id="homePage" class="page active">
    <div class="toolbar">
      <h2>キャラクター</h2>
      <div class="home-actions">
        <div class="view-buttons">
          <button class="secondary" id="viewCardBtn" type="button">▦ カード</button>
          <button class="secondary" id="viewIconBtn" type="button">● アイコン</button>
          <button class="secondary" id="viewListBtn" type="button">☰ リスト</button>
        </div>
        <button class="primary" id="newBtn">＋ キャラを登録</button>
      </div>
    </div>
    <div class="home-filter">
      <label for="useFilter">用途で絞り込み</label>
      <select id="useFilter">
        <option value="">すべて</option>
      </select>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <section id="editPage" class="page">
    <button class="back" id="backBtn">← ホームへ</button>
    <div class="form">
      <div class="field">
        <label>画像</label>
        <div class="preview" id="preview">画像なし</div>
        <input type="file" id="imageInput" accept="image/*">
        <div class="image-adjust" id="imageAdjust" style="display:none">
          <button type="button" id="openCropBtn">画像を調整</button>
        </div>
      </div>
      <div class="field">
        <label>キャラ名</label>
        <input type="text" id="nameInput" placeholder="例：ルシファー">
      </div>
      <div class="field">
        <label>何用のキャラ？</label>
        <input type="text" id="useInput" placeholder="例：Zeta / 創作 / 代理キャラ">
      </div>

      <div class="section-title">追加項目</div>
      <div id="customFields"></div>
      <div class="add-row">
        <input type="text" id="newKey" placeholder="項目名（例：誕生日）">
        <button id="addFieldBtn">項目追加</button>
      </div>

      <div class="section-title">共有</div>
      <div class="locked">
        🔗 共有URLを作成　　📷 プロフ帳画像を作成　　📥 データを取り込む
        <div class="notice">※このテスト版ではボタン配置のみ。共有機能は未実装です。</div>
      </div>

      <div class="actions">
        <button class="primary" id="saveBtn">保存</button>
        <button id="cancelBtn">キャンセル</button>
        <button id="deleteBtn" style="display:none">削除</button>
      </div>
      <div class="notice" id="saveStatus">このテスト版ではブラウザ内に保存します。</div>
    </div>
  </section>

  <section id="detailPage" class="page">
    <button class="back" id="detailBackBtn">← ホームへ</button>
    <div class="form">
      <div class="detail-hero">
        <div class="preview" id="detailImage">画像なし</div>
        <div class="detail-summary">
          <h2 id="detailName"></h2>
          <div class="detail-use-label">何用のキャラ？</div>
          <div id="detailUse" class="detail-use"></div>
        </div>
      </div>
      <div id="detailCustom" class="detail-custom"></div>
      <div class="section-title">共有</div>
      <div class="actions">
        <button>🔗 共有URL</button>
        <button>📷 プロフ帳画像</button>
        <button>📥 取り込み</button>
      </div>
      <div class="actions">
        <button class="primary" id="detailEditBtn">編集</button>
        <button id="detailBackBtn2">ホームへ</button>
      </div>
    </div>
  </section>
  <div class="crop-modal" id="cropModal" aria-hidden="true">
    <div class="crop-panel">
      <div class="crop-head">
        <button type="button" id="cropCloseTop" class="crop-close" aria-label="閉じる">×</button>
        <strong>画像切り抜き</strong>
        <button type="button" id="cropDone" class="crop-done">完了</button>
      </div>
      <div class="crop-help">プロフィール画像に使う部分を設定してください</div>
      <div class="crop-stage-wrap">
        <div class="crop-stage" id="cropStage"><img id="cropImage" alt=""></div>
      </div>
      <div class="crop-footer">
        <button type="button" id="cropReset" class="crop-reset">位置をリセット</button>
      </div>
    </div>
  </div>

</main>

<script>
const KEY='character_book_test_v2';
let data=[];
let editingId=null;
let imageData='';

function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){ data=[]; return; }
    const parsed=JSON.parse(raw);
    data=Array.isArray(parsed)?parsed:[];
  }catch(err){
    data=[];
    console.error(err);
    alert('保存データの読み込みに失敗しました。新しいデータとして開始します。');
  }
}

function saveData(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  }catch(err){
    console.error(err);
    alert('保存に失敗しました。\\n画像データが大きすぎる可能性があります。画像を自動圧縮して再保存します。');
    return false;
  }
}

function compressImageData(url,maxSize=1000,quality=.82){
  return new Promise(resolve=>{
    if(!url || !url.startsWith('data:image/')){resolve(url);return;}
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*scale));
      const h=Math.max(1,Math.round(img.naturalHeight*scale));
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let out=canvas.toDataURL('image/jpeg',quality);
      // If compression unexpectedly makes the file larger, keep the original.
      resolve(out.length<url.length ? out : url);
    };
    img.onerror=()=>resolve(url);
    img.src=url;
  });
}

async function prepareDataForSave(){
  const prepared=[];
  for(const c of data){
    if(!c || typeof c!=='object'){prepared.push(c);continue;}
    const copy={...c};
    if(copy.image) copy.image=await compressImageData(copy.image);
    prepared.push(copy);
  }
  return prepared;
}

const $=id=>document.getElementById(id);

function makeId(){
  if(window.crypto && typeof crypto.randomUUID==='function') return crypto.randomUUID();
  return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
}

function show(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(page).classList.add('active');
}

let cropPos={x:50,y:50,zoom:100};
let cropDraft={x:50,y:50,zoom:100};
let cropDragging=false;
let cropLastX=0,cropLastY=0;
let cropPinchStartDist=0,cropPinchStartZoom=100;

function imageStyle(c){
  const pos=c.imagePos||{};
  const x=pos.x ?? 50, y=pos.y ?? 50, zoom=pos.zoom ?? 100;
  return `object-position:${x}% ${y}%;transform:scale(${zoom/100});`;
}
function applyPreview(){
  if(!imageData){$('preview').innerHTML='画像なし';$('imageAdjust').style.display='none';return;}
  $('imageAdjust').style.display='block';
  $('preview').innerHTML=`<img src="${imageData}" style="${imageStyle({imagePos:cropPos})}">`;
}
function setImagePosition(pos){
  cropPos={x:Math.max(0,Math.min(100,Number(pos?.x??50))),y:Math.max(0,Math.min(100,Number(pos?.y??50))),zoom:Math.max(100,Math.min(300,Number(pos?.zoom??100)))};
  applyPreview();
}
function cropStyle(){return `object-position:${cropDraft.x}% ${cropDraft.y}%;transform:scale(${cropDraft.zoom/100});`;}
function renderCropEditor(){
  if(!imageData)return;
  $('cropImage').src=imageData;
  $('cropImage').style.cssText=cropStyle();
}
function openCropEditor(){if(!imageData)return;cropDraft={...cropPos};renderCropEditor();$('cropModal').classList.add('open');$('cropModal').setAttribute('aria-hidden','false');}
function closeCropEditor(){$('cropModal').classList.remove('open');$('cropModal').setAttribute('aria-hidden','true');}
function commitCrop(){cropPos={...cropDraft};applyPreview();closeCropEditor();}
function resetCropDraft(){cropDraft={x:50,y:50,zoom:100};renderCropEditor();}
function cropPointerDown(e){if(e.pointerType==='touch')return;cropDragging=true;cropLastX=e.clientX;cropLastY=e.clientY;$('cropStage').setPointerCapture?.(e.pointerId);}
function cropPointerMove(e){
  if(!cropDragging)return;
  const dx=e.clientX-cropLastX,dy=e.clientY-cropLastY;cropLastX=e.clientX;cropLastY=e.clientY;
  const stage=$('cropStage');
  const stepX=(dx/Math.max(1,stage.clientWidth))*100;
  const stepY=(dy/Math.max(1,stage.clientHeight))*100;
  cropDraft.x=Math.max(0,Math.min(100,cropDraft.x-stepX));
  cropDraft.y=Math.max(0,Math.min(100,cropDraft.y-stepY));
  renderCropEditor();
}
function cropPointerUp(){cropDragging=false;}
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

function updateUseFilter(){
  const select=$('useFilter');
  if(!select)return;
  const current=select.value;
  const uses=[...new Set(data.map(c=>(c&&typeof c==='object'?String(c.use||'').trim():'')).filter(Boolean))];
  select.innerHTML='<option value="">すべて</option>';
  uses.sort((a,b)=>a.localeCompare(b,'ja')).forEach(use=>{
    const opt=document.createElement('option');
    opt.value=use;
    opt.textContent=use;
    select.appendChild(opt);
  });
  if(uses.includes(current))select.value=current;
}

function renderHome(){
  const box=$('cards'); box.innerHTML='';
  updateUseFilter();
  const filter=$('useFilter')?.value||'';
  const visible=data.filter(c=>c && typeof c==='object' && (!filter || String(c.use||'').trim()===filter));

  if(!data.length){
    box.innerHTML='<div class="empty" style="grid-column:1/-1">まだキャラがいません。<br>「＋ キャラを登録」から追加できます。</div>';
    return;
  }
  if(!visible.length){
    box.innerHTML='<div class="empty" style="grid-column:1/-1">この用途のキャラはいません。</div>';
    return;
  }

  visible.forEach(c=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<div class="card-img">${c.image?`<img src="${c.image}" style="${imageStyle(c)}">`:'画像なし'}</div>
      <div class="card-body"><div class="card-name">${esc(c.name)||'名前未設定'}</div>
      <div class="card-use">${esc(c.use)||'用途未設定'}${c.locked?'　🔒':''}</div></div>`;
    el.onclick=()=>openDetail(c.id);
    box.appendChild(el);
  });
}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function resetForm(){
  editingId=null; imageData=''; cropPos={x:50,y:50,zoom:100};
  setImagePosition({x:50,y:50,zoom:100});
  $('nameInput').value=''; $('useInput').value=''; $('imageInput').value='';
  $('customFields').innerHTML='';
  $('preview').innerHTML='画像なし';
  $('deleteBtn').style.display='none';
}

function openNew(){
  resetForm(); show('editPage');
}

function openEdit(id){
  const c=data.find(x=>x.id===id); if(!c)return;
  editingId=id; imageData=c.image||'';
  setImagePosition(c.imagePos||{x:50,y:50,zoom:100});
  $('nameInput').value=c.name||''; $('useInput').value=c.use||'';
  $('imageInput').value='';
  $('preview').innerHTML=imageData?`<img src="${imageData}" style="${imageStyle({imagePos:cropPos})}">`:'画像なし';
  renderCustom(c.custom||[]);
  requestAnimationFrame(()=>requestAnimationFrame(bindAutoGrow));
  $('deleteBtn').style.display=c.locked?'none':'inline-block';
  show('editPage');
}

function renderCustom(items){
  $('customFields').innerHTML='';
  items.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='custom-item';
    row.innerHTML=`<input type="text" value="${esc(it.key)}" placeholder="項目名">
      <textarea class="auto-grow" placeholder="内容">${esc(it.value)}</textarea>
      <button>削除</button>`;
    row.querySelector('button').onclick=()=>{row.remove()};
    $('customFields').appendChild(row);
  });
  bindAutoGrow();
}

function readCustom(){
  return [...document.querySelectorAll('#customFields .custom-item')].map(r=>{
    const key=r.querySelector('input');
    const value=r.querySelector('textarea');
    return {key:key.value,value:value.value};
  }).filter(x=>x.key||x.value);
}

function autoGrow(el){
  el.style.height='auto';
  requestAnimationFrame(()=>{const max=168;el.style.height=Math.min(max,Math.max(42,el.scrollHeight))+'px';el.style.overflowY=el.scrollHeight>max?'auto':'hidden';});
}

function bindAutoGrow(){
  document.querySelectorAll('.auto-grow').forEach(el => {
    if(el.dataset.autoGrowBound) return;
    el.dataset.autoGrowBound = '1';
    el.addEventListener('input', () => autoGrow(el));
    autoGrow(el);
  });
}

function openDetail(id){
  const c=data.find(x=>x.id===id); if(!c)return;
  $('detailName').textContent=c.name||'名前未設定';
  $('detailUse').textContent=c.use||'用途未設定';
  $('detailImage').innerHTML=c.image?`<img src="${c.image}" style="${imageStyle(c)}">`:'画像なし';
  $('detailCustom').innerHTML='';
  (c.custom||[]).forEach(it=>{
    const p=document.createElement('p');
    const label=document.createElement('strong');
    const value=document.createElement('div');
    label.textContent=it.key||'';
    value.className='detail-value';
    value.textContent=it.value||'';
    p.appendChild(label);
    p.appendChild(value);
    $('detailCustom').appendChild(p);
  });
  $('detailEditBtn').onclick=()=>openEdit(id);
  $('detailBackBtn2').onclick=()=>show('homePage');
  show('detailPage');
}

$('newBtn').onclick=openNew;
$('backBtn').onclick=()=>show('homePage');
$('cancelBtn').onclick=()=>show('homePage');
$('detailBackBtn').onclick=()=>show('homePage');
$('importBtn').onclick=()=>alert('URLから追加：次の段階で実装予定です。');

$('addFieldBtn').onclick=()=>{
  const key=$('newKey').value.trim();
  if(!key)return;
  const row=document.createElement('div'); row.className='custom-item';
  row.innerHTML=`<input type="text" value="${esc(key)}"><textarea class="auto-grow" placeholder="内容"></textarea><button>削除</button>`;
  row.querySelector('button').onclick=()=>row.remove();
  $('customFields').appendChild(row);
  bindAutoGrow();
  requestAnimationFrame(()=>autoGrow(row.querySelector('textarea')));
  $('newKey').value='';
};

$('imageInput').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{imageData=reader.result; setImagePosition({x:50,y:50,zoom:100}); openCropEditor();};
  reader.readAsDataURL(file);
};

$('openCropBtn').onclick=openCropEditor;
$('cropCloseTop').onclick=closeCropEditor;
$('cropDone').onclick=commitCrop;
$('cropReset').onclick=resetCropDraft;
$('cropStage').addEventListener('pointerdown',cropPointerDown);
$('cropStage').addEventListener('pointermove',cropPointerMove);
$('cropStage').addEventListener('pointerup',cropPointerUp);
$('cropStage').addEventListener('pointercancel',cropPointerUp);
$('cropStage').addEventListener('wheel',e=>{e.preventDefault();cropDraft.zoom=Math.max(100,Math.min(300,cropDraft.zoom+(e.deltaY<0?5:-5)));renderCropEditor();},{passive:false});
$('cropStage').addEventListener('touchstart',e=>{
  if(e.touches.length===2){cropPinchStartDist=touchDistance(e.touches[0],e.touches[1]);cropPinchStartZoom=cropDraft.zoom;}
  else if(e.touches.length===1){cropDragging=true;cropLastX=e.touches[0].clientX;cropLastY=e.touches[0].clientY;}
},{passive:true});
$('cropStage').addEventListener('touchmove',e=>{
  if(e.touches.length===1){
    e.preventDefault();
    const dx=e.touches[0].clientX-cropLastX,dy=e.touches[0].clientY-cropLastY;cropLastX=e.touches[0].clientX;cropLastY=e.touches[0].clientY;
    const stage=$('cropStage');
    const stepX=(dx/Math.max(1,stage.clientWidth))*100;
    const stepY=(dy/Math.max(1,stage.clientHeight))*100;
    cropDraft.x=Math.max(0,Math.min(100,cropDraft.x-stepX));
    cropDraft.y=Math.max(0,Math.min(100,cropDraft.y-stepY));
    renderCropEditor();
  }else if(e.touches.length===2){
    e.preventDefault();
    const d=touchDistance(e.touches[0],e.touches[1]);
    if(cropPinchStartDist)cropDraft.zoom=Math.max(100,Math.min(300,cropPinchStartZoom*(d/cropPinchStartDist)));
    renderCropEditor();
  }
},{passive:false});
$('cropStage').addEventListener('touchend',e=>{if(e.touches.length===0){cropDragging=false;cropPinchStartDist=0;}},{passive:true});

$('saveBtn').onclick=async()=>{
  const existing=editingId?data.find(x=>x.id===editingId):null;
  if(existing?.locked){alert('共有から取り込んだキャラは編集できません。');return;}

  const c={
    id:editingId||makeId(),
    name:$('nameInput').value.trim(),
    use:$('useInput').value.trim(),
    image:imageData,
    imagePos:{...cropPos},
    custom:readCustom(),
    locked:existing?.locked||false
  };

  const oldData=data;
  if(editingId)data=data.map(x=>x.id===editingId?c:x);
  else data=[...data,c];

  $('saveBtn').disabled=true;
  $('saveBtn').textContent='保存中…';

  try{
    // localStorageは容量が小さいため、画像を保存前に軽量化する。
    data=await prepareDataForSave();
    if(!saveData()){
      data=oldData;
      return;
    }
    // 保存後に、圧縮済み画像を現在編集中の画像にも反映。
    const saved=editingId?data.find(x=>x.id===editingId):data.find(x=>x.id===c.id);
    if(saved)imageData=saved.image||'';
    updateUseFilter();
    renderHome();
    show('homePage');
  }finally{
    $('saveBtn').disabled=false;
    $('saveBtn').textContent='保存';
  }
};

$('deleteBtn').onclick=()=>{
  if(!editingId)return;
  if(confirm('このキャラを削除しますか？')){
    const oldData=data;
    data=data.filter(x=>x.id!==editingId);
    if(saveData()){
      updateUseFilter();
      renderHome();
      show('homePage');
    }else{
      data=oldData;
    }
  }
};

loadData();
renderHome();

function setViewMode(mode){
  const cards=$('cards');
  cards.classList.remove('icon-mode','list-mode');
  if(mode==='icon') cards.classList.add('icon-mode');
  if(mode==='list') cards.classList.add('list-mode');
  localStorage.setItem('characterBookViewMode',mode);
}

function restoreViewMode(){
  setViewMode(localStorage.getItem('characterBookViewMode')||'card');
}

$('viewCardBtn').onclick=()=>setViewMode('card');
$('viewIconBtn').onclick=()=>setViewMode('icon');
$('viewListBtn').onclick=()=>setViewMode('list');
$('useFilter').onchange=()=>renderHome();


restoreViewMode();

</script>
</body>
