<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お取引ノート</title><link rel="icon" type="image/png" href="./favicon.png"><link rel="icon" href="./favicon.ico"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="stylesheet" href="styles.css"></head><body><header><div><h1>お取引ノート</h1><small>交換・譲渡・買取を、ひとまとめに。</small></div><button id="new">＋ 新しい取引</button></header><main><div id="stats"></div><div class="tools"><input id="q" placeholder="相手・内容・メモを検索"><select id="filter"><option value="active">進行中</option><option value="done">完了</option><option value="all">すべて</option></select><button id="archives">Archive</button></div><div id="cards"></div></main><dialog id="dlg"><form method="dialog"><div class="dialog-head"><h2 id="title">新しい取引</h2><button type="button" id="closeDlg" class="closebtn" aria-label="閉じる">×</button></div><div class="dialog-body"><input id="id" type="hidden"><div class="grid"><label>取引種別<select id="type"><option>交換</option><option>譲渡</option><option>買取</option></select></label><label>受け渡し<select id="delivery"><option>郵送</option><option>手渡し</option></select></label><label>ステータス<select id="status"></select></label><label>相手の表示名<input id="name"></label><label>X ID<input id="xid" placeholder="@example"></label></div><label>取引内容<textarea id="items" rows="3"></textarea></label><div id="postal" class="grid"><label>自分の発送日<input id="myShip" type="date"></label><label>相手の発送日<input id="theirShip" type="date"></label><label>発送方法<input id="shipping"></label><label>追跡番号<input id="tracking"></label></div><div id="meet" class="grid hide"><label>手渡し日時<input id="meetAt" type="datetime-local"></label><label>手渡し場所<input id="meetPlace"></label></div><div id="money"><div class="grid"><label>商品代<input id="price" inputmode="numeric"></label><label>送料<input id="postage" inputmode="numeric"></label></div><label class="check"><input id="paid" type="checkbox">支払い済み</label></div><label id="address" class="check"><input id="addressExchanged" type="checkbox">住所交換済み</label><label>メモ<textarea id="memo" rows="4"></textarea></label><div class="actions"><button type="button" id="save">保存</button><span class="action-gap"></span><div class="secondary-actions"><button type="button" id="arc">Archiveへ</button><button type="button" id="del">削除</button></div></div></div></form></dialog><footer><span>データはこのブラウザ内に保存されます。</span><button id="export">書き出し</button><label class="file">読み込み<input id="import" type="file" accept=".json"></label></footer><script src="app.js"></script></body></html>
